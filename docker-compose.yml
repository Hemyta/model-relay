services:
  relay:
    build:
      context: .
      target: runtime
    image: model-relay:latest
    environment:
      PORT: "${PORT:-7500}"
      RELAY_TOKEN: "${RELAY_TOKEN:?RELAY_TOKEN is required}"
    ports:
      - "127.0.0.1:${PORT:-7500}:${PORT:-7500}"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/healthz', timeout=2)\""
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0